[package]
name = "spacesweeper"
version = "0.2.0"
description = "macOS 磁盘空间发现与安全回收工具"
authors = ["Dingyuan Liu"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rayon = "1.10"
walkdir = "2.5"
trash = "5"
uuid = { version = "1", features = ["v4"] }
blake3 = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
