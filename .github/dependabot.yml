version: 2
updates:
  # 仅保留 main/dev 开发分支：不自动创建版本更新分支和 PR，按需手动升级。
  # 依赖安全告警在 GitHub Security 页面人工评估。
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Linux 专用 GTK 依赖，macOS 目标不会编译；当前 Tauri/tao/wry 仍固定 gtk ^0.18。
      # glib 0.20 修复了 GHSA-wrw7-89jp-8q8g，但 gtk 0.18 无法使用该版本。
      # 上游升级到 gtk >= 0.20 后，此忽略规则会自动放行新版本。
      - dependency-name: "glib"
        versions: ["< 0.20.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
